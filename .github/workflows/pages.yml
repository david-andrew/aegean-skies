# Build the game for the web and publish it with GitHub Pages on every push to main.
name: Publish to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  # keep in sync with SLOPPY_VERSION in .github/workflows/tests.yml
  SLOPPY_VERSION: v0.44.0
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # first step: nothing that must stay out of git may be tracked or committed
      - name: Guard (no scratch, recordings, soundfonts or big binaries)
        run: |
          python3 tools/check_tracked_files.py
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            python3 tools/check_tracked_files.py --range "$before..${{ github.sha }}"
          fi
      - name: Install Sloppy
        run: |
          curl -fsSL https://sloppy-lang.org/install | bash -s "$SLOPPY_VERSION"
          echo "$HOME/.sloppy/bin" >> "$GITHUB_PATH"
      - name: Bake the eroded land
        run: sloppy --release tools/bake.jo
      # (the far economy's opening for the start's world, which the title takes instead of making
      # it; the tool reads its bake back as the game does and fails unless it is the opening made)
      - name: Bake the far economy's opening
        run: AEGEAN_TITLE=1 SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 SLOPPY_FRAMES=1 SLOPPY_SCREENSHOT=far-bake.png sloppy --release tools/bake_far_opening.jo
      - name: Geography and canonical terrain checks
        run: |
          SLOPPY_NO_AUDIO=1 sloppy test tests/geography_test.jo
          SLOPPY_NO_AUDIO=1 sloppy test tests/world_detail_test.jo
          SLOPPY_NO_AUDIO=1 sloppy --release tools/terrain_check.jo
          SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 sloppy --release tools/world_cache_check.jo
          SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 sloppy --release tools/terrain_arrival_check.jo
          # (level-of-detail pops: the woods glide, a low fast flight over hills, a mountain approach, in to a harbour along the coast)
          SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 sloppy --release tools/lod_pop_check.jo
          SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 AEGEAN_POP_PATH="-118000 1250 -128000 0 0 -80 0 -0.1" AEGEAN_POP_FIRST=420 AEGEAN_POP_FRAMES=2220 sloppy --release tools/lod_pop_check.jo
          SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 AEGEAN_POP_PATH="-125000 900 -135000 70 -2 0 -1.5708 -0.12" AEGEAN_POP_FIRST=420 AEGEAN_POP_FRAMES=2220 sloppy --release tools/lod_pop_check.jo
          SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 AEGEAN_POP_PATH="-118500 300 -85800 -29.5 -1.5 -34 0.7147 -0.12" AEGEAN_POP_FIRST=420 AEGEAN_POP_FRAMES=2220 sloppy --release tools/lod_pop_check.jo
          SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 AEGEAN_POP_ORBIT="-128440 154 -130050 28 24" AEGEAN_POP_FIRST=960 AEGEAN_POP_FRAMES=1680 sloppy --release tools/lod_pop_check.jo
          SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 AEGEAN_POP_ORBIT="-126000 800 -128000 0 20 -0.10" AEGEAN_POP_FIRST=720 AEGEAN_POP_FRAMES=1320 sloppy --release tools/lod_pop_check.jo
          # (cracks in the ground, drawn by the game's own shaders at five frames along each of those paths)
          python3 tests/terrain_crack_test.py
          SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 SLOPPY_FRAMES=1 SLOPPY_SCREENSHOT=depth-check.png sloppy --release tools/world_depth_check.jo
      - name: Sea detail regression
        run: |
          python3 -m pip install Pillow
          SLOPPY_NO_AUDIO=1 sloppy test tests/sea_detail_test.jo
          SLOPPY_SOFTWARE=1 python3 tests/sea_detail_render_test.py
      - name: Flight tests
        run: |
          SLOPPY_NO_AUDIO=1 sloppy test tests/flight_test.jo
          SLOPPY_NO_AUDIO=1 sloppy test tests/damage_test.jo
          SLOPPY_NO_AUDIO=1 sloppy test tests/living_scene.jo
      - name: Name the build (the label at the bottom of the screen, src/build_label.jo)
        run: printf '%s · run %s · %s' "${GITHUB_SHA::7}" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%d)" > data/build.txt
      - name: Check the game compiles and runs headless
        run: |
          sloppy check aegean.jo
          timeout 300 env SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 SLOPPY_SCREENSHOT=shot.png SLOPPY_FRAMES=2 sloppy aegean.jo
      - name: Build the web page
        run: |
          mkdir -p site
          # (the page and its program beside it, index.wasm, which the browser compiles while it
          # downloads; the page asks for it as index.wasm?v=<hash>, so no cache serves an old one)
          sloppy build aegean.jo --target wasm --release --wasm-file -o site/index.html
          test -s site/index.wasm
      # (the site's icons, drawn by tools/site_icons.py; the link-card picture, one frame of the
      # game committed as docs/site-preview.png (tools/site_preview.sh draws it on a GPU: CI's
      # software renderer draws its low sun wrongly); and the page's head: description, Open Graph
      # and Twitter card tags, icons, manifest. tools/site_head.py fails the build if the head the
      # build wrote is not the one it knows or a file it names is missing or the wrong size)
      - name: Site icons, link-card picture and page head
        run: |
          python3 -m pip install Pillow
          python3 tests/site_head_test.py
          python3 tools/site_icons.py site
          cp docs/site-preview.png site/preview.png
          python3 tools/site_head.py site
          python3 tools/site_head.py site --check
      - name: WebGL2 minimum shader budgets
        run: |
          node tools/web_compat_test.cjs
          node tools/check_web_shaders.cjs site/index.html > shader-budgets.json
          SLOPPY_NO_AUDIO=1 SLOPPY_SOFTWARE=1 SLOPPY_THREADS=1 sloppy test tests/quality_test.jo
          SLOPPY_NO_AUDIO=1 SLOPPY_SOFTWARE=1 SLOPPY_THREADS=1 sloppy test tests/sky_test.jo --release
          SLOPPY_NO_AUDIO=1 SLOPPY_SOFTWARE=1 SLOPPY_THREADS=1 sloppy test tests/nature_test.jo --release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    # (a run of a branch by hand builds and checks the page but never publishes it)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
