# Build the game for the web and publish it with GitHub Pages on every push to main.
name: Publish to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  SLOPPY_VERSION: v0.32.0
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Sloppy
        run: |
          curl -fsSL https://sloppy-lang.org/install | bash -s "$SLOPPY_VERSION"
          echo "$HOME/.sloppy/bin" >> "$GITHUB_PATH"
      - name: Bake the eroded land
        run: sloppy --release tools/bake.jo
      - name: Geography and canonical terrain checks
        run: |
          SLOPPY_NO_AUDIO=1 sloppy test tests/geography_test.jo
          SLOPPY_NO_AUDIO=1 sloppy test tests/world_detail_test.jo
          SLOPPY_NO_AUDIO=1 sloppy --release tools/terrain_check.jo
          SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 sloppy --release tools/world_cache_check.jo
          SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 SLOPPY_FRAMES=1 SLOPPY_SCREENSHOT=depth-check.png sloppy --release tools/world_depth_check.jo
      - name: Flight tests
        run: |
          SLOPPY_NO_AUDIO=1 sloppy test tests/flight_test.jo
          SLOPPY_NO_AUDIO=1 sloppy test tests/damage_test.jo
          SLOPPY_NO_AUDIO=1 sloppy test tests/living_scene.jo
      - name: Check the game compiles and runs headless
        run: |
          sloppy check aegean.jo
          timeout 300 env SLOPPY_SOFTWARE=1 SLOPPY_NO_AUDIO=1 SLOPPY_SCREENSHOT=shot.png SLOPPY_FRAMES=2 sloppy aegean.jo
      - name: Build the web page
        run: |
          mkdir -p site
          sloppy build aegean.jo --target wasm --release -o site/index.html
          python3 tools/package_web.py site/index.html
          cp shot.png site/preview.png
      - name: WebGL2 minimum shader budgets
        run: |
          node tools/web_compat_test.cjs
          node tools/check_web_shaders.cjs site/index.html > shader-budgets.json
          SLOPPY_NO_AUDIO=1 SLOPPY_SOFTWARE=1 SLOPPY_THREADS=1 sloppy test tests/quality_test.jo
          SLOPPY_NO_AUDIO=1 SLOPPY_SOFTWARE=1 SLOPPY_THREADS=1 sloppy test tests/sky_test.jo --release
          SLOPPY_NO_AUDIO=1 SLOPPY_SOFTWARE=1 SLOPPY_THREADS=1 sloppy test tests/nature_test.jo --release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
